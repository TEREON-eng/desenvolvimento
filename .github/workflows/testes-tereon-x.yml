name: TEREON X - testes do catálogo
on:
  push:
    branches: [desenvolvimento]
  pull_request:
    branches: [main]
jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato do catálogo
        run: node x/tests/catalogo.test.cjs
      - name: Validar módulos independentes, listas e persistência
        run: node x/tests/modulos.test.cjs
      - name: Validar motor independente de identidade
        run: node x/tests/identidade.test.cjs
      - name: Validar compartilhamento independente entre usuários
        run: node x/tests/compartilhar-usuarios.test.cjs
      - name: Validar motor independente de Obras
        run: node x/tests/obras.test.cjs
      - name: Validar motor de Identidade e Relações
        run: node x/tests/relacoes.test.cjs
      - name: Validar listas na nuvem e conflitos
        run: node x/tests/listas-nuvem.test.cjs
      - name: Validar Motor único de Listas e sincronização
        run: node x/tests/listas-integracao.test.cjs
      - name: Validar modal aprovado com fichas atuais
        run: node x/tests/modal-fichas.test.cjs
      - name: Validar Início único e criação em modal
        run: node x/tests/home-navigation.test.cjs
