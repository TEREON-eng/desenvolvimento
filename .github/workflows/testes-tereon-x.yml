name: TEREON X - testes do catálogo
on:
  push:
    branches: [desenvolvimento]
  pull_request:
    branches: [main]
jobs:
  catalog-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar contrato do catálogo
        run: node x/tests/catalogo.test.cjs
      - name: Validar módulos independentes, listas e persistência
        run: node x/tests/modulos.test.cjs
      - name: Validar motor independente de identidade
        run: node x/tests/identidade.test.cjs
      - name: Validar compartilhamento independente entre usuários
        run: node x/tests/compartilhar-usuarios.test.cjs
      - name: Validar motor independente de Obras
        run: node x/tests/obras.test.cjs
      - name: Validar motor de Identidade e Relações
        run: node x/tests/relacoes.test.cjs
      - name: Validar listas na nuvem e conflitos
        run: node x/tests/listas-nuvem.test.cjs
      - name: Validar Motor único de Listas e sincronização
        run: node x/tests/listas-integracao.test.cjs
      - name: Validar modal aprovado com fichas atuais
        run: node x/tests/modal-fichas.test.cjs
      - name: Validar Início único e criação em modal
        run: node x/tests/home-navigation.test.cjs
      - name: Validar estados de conexão e conta
        run: node x/tests/status.test.cjs
      - name: Validar aparências sem mudar comportamento
        run: node x/tests/aparencia.test.cjs
      - name: Validar nome de perfil no cabeçalho
        run: node x/tests/perfil-cabecalho.test.cjs
      - name: Validar trilha de navegação por tela
        run: node x/tests/trilha-navegacao.test.cjs
      - name: Validar cabeçalho único em todos os módulos
        run: node x/tests/cabecalho.test.cjs
      - name: Validar cadastro de funcionários, situação e cabeçalho de Obras
        run: node x/tests/empreiteiros-funcionarios.test.cjs
      - name: Validar refinamento visual e contratos de Obras
        run: node x/tests/obras-refino-visual.test.cjs
      - name: Validar painel de Obras, cadastro de empreiteiros e PDF do Diário
        run: node x/tests/obras-navegacao-pdf.test.cjs
      - name: Validar execução diária, conclusão e justificativas
        run: node x/tests/diario-execucao.test.cjs
      - name: Validar programação independente de equipes no Diário
        run: node x/tests/diario-programacao.test.cjs
      - name: Validar motor independente Escopo Etapa Subetapa
        run: node x/tests/escopo-motor.test.cjs
      - name: Validar hierarquia de etapas de Obras sem associações automáticas
        run: node x/tests/escopo-etapas.test.cjs
      - name: Validar contratos do fechamento X.0.3.29
        run: node x/tests/contratos-fechamento-2026-11-09.test.cjs
      - name: Auditar fronteiras de independência e modal aprovado
        run: node x/tests/independencia.test.cjs
