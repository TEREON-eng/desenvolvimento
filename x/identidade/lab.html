<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEREON X · Laboratório de Identidade</title>
<link rel="stylesheet" href="./lab.css">
</head>
<body>
<main class="shell">
  <header><div class="brand">TEREON <span>X</span></div><div class="eyebrow">LABORATÓRIO INDEPENDENTE</div>
  <h1>Minha conta</h1><p>Login e perfil do TEREON X, separados das Listas e do aplicativo principal.</p></header>
  <section class="panel" aria-labelledby="auth-title">
    <div class="tabs"><button type="button" data-mode="login" class="active">Entrar</button><button type="button" data-mode="register">Criar conta</button><button type="button" data-mode="reset">Recuperar senha</button></div>
    <h2 id="auth-title">Entrar no TEREON X</h2>
    <form id="auth-form">
      <label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required>
      <div id="password-row"><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
      <button class="primary" type="submit" id="submit">Entrar</button>
    </form>
  </section>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <section class="panel hidden" id="signed" aria-labelledby="signed-title">
    <h2 id="signed-title">Sessão ativa</h2><p id="account"></p>
    <form id="profile-form"><label for="display-name">Nome de exibição</label><input id="display-name" maxlength="120" autocomplete="name"><button type="submit" class="primary">Salvar perfil</button></form>
    <button id="logout" type="button" class="secondary">Sair da conta</button>
  </section>
  <section class="panel hidden" id="recovery-panel">
    <h2>Definir nova senha</h2><form id="recovery-form"><label for="new-password">Nova senha</label><input id="new-password" type="password" minlength="8" autocomplete="new-password" required><button type="submit" class="primary">Atualizar senha</button></form>
  </section>
  <footer>Ambiente de teste. Nenhum cadastro de obra ou solicitação é iniciado por esta tela.</footer>
</main>
<script src="./auth.js"></script>
<script type="module" src="./lab.js"></script>
</body></html>
