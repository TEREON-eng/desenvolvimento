<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="application-name" content="TEREON X"><link rel="manifest" href="/x/manifest.webmanifest"><link rel="icon" type="image/png" href="/assets/icon-192-v518.png"><link rel="apple-touch-icon" href="/assets/icon-192-v518.png"><title>TEREON X · Laboratório</title>
<link rel="stylesheet" href="/x/styles.css?v=2">
</head>
<body>
<div class="shell">
  <header class="top"><div><div class="brand">TEREON X</div><div class="sub">Laboratório · fluxo de listas</div></div><div class="top-actions"><a class="btn small x-hub-link" href="/x/laboratorios/" aria-label="Voltar ao início do TEREON X">← Início</a><button class="btn small" id="installButton" type="button">↓ Instalar</button></div></header>
  <main id="screen"></main>
</div>
<dialog id="createDialog" aria-labelledby="createTitle">
 <form method="dialog" id="createForm" class="dialog-inner"><div class="header-modal"><h2 id="createTitle">Criar lista</h2><button class="btn ghost small" type="button" data-close="createDialog" aria-label="Fechar">✕</button></div>
 <label>Nome da lista<input id="newName" maxlength="100" required autocomplete="off" placeholder="Ex.: Reforma elétrica — Bloco A"></label>
 <div class="footer-actions"><button class="btn" type="button" data-close="createDialog">Cancelar</button><button class="btn primary" type="submit">Criar lista</button></div></form>
</dialog>
<dialog id="installDialog" aria-labelledby="installTitle"><div class="dialog-inner"><div class="header-modal"><h2 id="installTitle">Instalar TEREON X</h2><button class="btn ghost small" type="button" data-close="installDialog" aria-label="Fechar">✕</button></div><p class="install-help" id="installInstructions">Use a opção de instalação do navegador para colocar o TEREON X na tela inicial.</p><button type="button" class="btn primary full" data-close="installDialog">Entendi</button></div></dialog>
<dialog id="addDialog" aria-labelledby="addTitle">
 <div class="dialog-inner">
  <div class="header-modal"><h2 id="addTitle">Adicionar item</h2><button class="btn ghost small" type="button" data-close="addDialog" aria-label="Fechar">✕</button></div>
  <div><div class="heading">NOME TÉCNICO EM FORMAÇÃO</div><div class="name" id="liveName"></div></div>
  <div class="progress" id="progress" aria-label="Progresso de características obrigatórias"></div>
  <div class="row tiny muted"><span id="counter"></span><span>Ficha de demonstração</span></div>
  <div class="choice-area section"><div class="choice-head"><strong id="fieldLabel"></strong><span id="fieldType" class="tiny muted"></span></div><div class="choices" id="choices"></div><div class="note" id="fieldHelp"></div></div>
  <div class="review section">
    <div class="tag-tray" id="tags" aria-label="Características confirmadas"></div>
    <div class="tag-fields-divider" aria-hidden="true"></div>
    <div class="fields">
     <label>Qtd.<input id="qty" type="number" inputmode="decimal" min="0.001" step="any" value="100"></label>
     <label>Unidade<select id="unit"><option value="m">m</option><option value="un">un</option><option value="rl">rl</option></select></label>
     <label>Etapa<input id="stage" maxlength="100" autocomplete="off" placeholder="Ex.: QD1" value="Geral"></label>
    </div>
    <div class="stage-tags" id="stageTags"></div>
    <button class="btn primary full" id="saveItem" disabled>＋ Adicionar à lista</button>
  </div>
 </div>
</dialog>
<script src="/x/listas/store.js?v=1"></script>
<script src="/x/listas/servico.js?v=1"></script>
<script src="/x/motor-compartilhar.js?v=1"></script>
<script src="/x/catalogo/motor.js?v=3"></script>
<script src="/x/catalogo/seletor.js?v=1"></script>
<script src="/x/listas/app.js?v=2"></script>
<script src="/x/pwa.js?v=1"></script>
</body>
</html>
