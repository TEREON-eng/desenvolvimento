<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="application-name" content="TEREON X"><link rel="manifest" href="/x/manifest.webmanifest"><link rel="icon" type="image/png" href="/assets/icon-192-v518.png"><link rel="apple-touch-icon" href="/assets/icon-192-v518.png"><title>TEREON X · Laboratório</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#18221e;background:#f6f8f6;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #317a57;outline-offset:2px}
.shell{max-width:660px;margin:auto;padding:18px 16px 32px;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid #e1e6e2;margin-bottom:22px;gap:8px}.top-actions{display:flex;align-items:center;gap:3px}.install-help{font-size:13px;color:#56685a;line-height:1.55}
.brand{font-weight:750;letter-spacing:.045em;font-size:16px}.sub{font-size:11px;color:#718078}.muted{color:#6e7c72}.tiny{font-size:11px}
h1{font-size:24px;font-weight:690;letter-spacing:-.6px;margin:0 0 9px}h2{font-size:16px;margin:0}p{margin:0;line-height:1.45}
.btn{border:1px solid #d3ded6;background:#fff;border-radius:11px;padding:10px 13px;color:#24342b;font-size:13px;font-weight:550;min-height:40px}
.btn.primary{background:#213d2d;border-color:#213d2d;color:white}.btn.ghost{background:transparent;border-color:transparent}
.btn.full{width:100%}.btn.small{min-height:29px;padding:5px 8px;font-size:11px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:27px}
.tile{min-height:140px;padding:17px;text-align:left;border:1px solid #dfe5df;border-radius:16px;background:white;display:flex;flex-direction:column;justify-content:space-between;gap:25px}
.tile strong{font-size:15px}.tile span{font-size:11px;color:#778279}.symbol{font-size:25px;font-weight:300}
.stack{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.back{margin-right:8px}
.listrow{border:1px solid #e1e5e0;border-radius:12px;background:#fff;padding:14px;text-align:left;width:100%;display:flex;justify-content:space-between;gap:12px}
.items{margin-top:14px;background:#fff;border:1px solid #e1e5e0;border-radius:12px;overflow:hidden}
.item{padding:13px 14px;border-bottom:1px solid #edf0ed;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.item:last-child{border:0}.item strong{font-size:13px;font-weight:590}.item small{display:block;color:#7b877d;font-size:11px;margin-top:6px}.item aside{text-align:right;min-width:82px}.item aside strong{white-space:nowrap}.item-actions{display:flex;justify-content:flex-end;gap:3px;margin-top:6px}.item-icon{width:30px;height:30px;min-width:30px;min-height:30px;border:1px solid transparent;background:transparent;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#526a58;padding:0}.item-icon:hover,.item-icon:focus-visible{background:#edf3ee;border-color:#dbe5dd}.item-icon.remove{color:#9a625d}.item-icon svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:32px 16px;text-align:center;color:#8c958e;font-size:13px}
label{font-size:11px;color:#526457;display:grid;gap:5px}
input,select{min-width:0;width:100%;padding:8px 9px;background:#fff;border:1px solid #d5ded6;border-radius:9px;min-height:37px;color:#19241d;font-size:13px}
dialog{border:0;border-radius:18px;background:#fff;color:inherit;box-shadow:0 18px 65px #10251930;padding:0;width:min(540px,calc(100vw - 20px));max-width:none;max-height:calc(100dvh - 20px)}
dialog::backdrop{background:#14281d77;backdrop-filter:blur(2px)}
.dialog-inner{padding:16px;display:flex;flex-direction:column;gap:12px}
#createDialog .dialog-inner{padding:20px;gap:17px}
#addDialog{height:min(650px,calc(100dvh - 20px))}
#addDialog .dialog-inner{height:100%;min-height:0;gap:9px}
.header-modal{display:flex;align-items:center;justify-content:space-between;gap:12px}
.heading{font-size:11px;color:#849187;letter-spacing:.045em;font-weight:650}
.name{font-size:14px;font-weight:650;line-height:1.43;min-height:40px;max-height:40px;overflow:auto}
.progress{display:flex;gap:3px;height:4px}.segment{flex:1;border-radius:9px;background:#e9eee9}.segment.done{background:#859b8a}
.tag-tray{min-height:58px;height:auto;overflow:visible;display:flex;flex-wrap:wrap;gap:6px 5px;padding:5px 4px 9px;align-content:flex-start;align-items:flex-start}
.tag{padding:3px 6px;border:1px solid #d9e1da;border-radius:6px;background:white;color:#4c6152;font-size:10px;line-height:1.15;white-space:nowrap}
.tag.required{border:1px solid #82968a;outline:1px solid #82968a;outline-offset:1px;margin:1px}
.tag.option{padding:7px 10px;font-size:12px;border-radius:8px}
.tag.option.on{background:#e9f1ea;border-color:#78927d}
.section{border-top:1px solid #edf0ed;padding-top:10px}
.choice-area{min-height:0;flex:1;display:flex;flex-direction:column;gap:12px}
.choice-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.choice-head strong{font-size:14px}
.choices{display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:8px;overflow:auto;min-height:0;padding:2px 2px 7px}
.fields{display:grid;grid-template-columns:1fr .8fr 1.5fr;gap:7px}
.stage-tags{display:flex;gap:5px;overflow-x:auto;align-items:center;padding:3px 2px;min-height:25px;white-space:nowrap}
.note{font-size:11px;color:#77847a}
.review{flex-shrink:0;display:grid;gap:7px}.tag-fields-divider{height:1px;background:#e5ebe6;margin:1px 0 2px}.notice{font-size:11px;color:#8b603c}
.footer-actions{display:flex;gap:7px;justify-content:flex-end}
@media(max-width:380px){.shell{padding:14px 12px}.dialog-inner{padding:13px}.fields{grid-template-columns:.78fr .72fr 1.5fr}.btn{padding:9px 10px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div><div class="brand">TEREON X</div><div class="sub">Laboratório · fluxo de listas</div></div><div class="top-actions"><button class="btn small" id="installButton" type="button">↓ Instalar</button><button class="btn ghost small" id="homeButton">Início</button></div></header>
  <main id="screen"></main>
</div>
<dialog id="createDialog" aria-labelledby="createTitle">
 <form method="dialog" id="createForm" class="dialog-inner"><div class="header-modal"><h2 id="createTitle">Criar lista</h2><button class="btn ghost small" type="button" data-close="createDialog" aria-label="Fechar">✕</button></div>
 <label>Nome da lista<input id="newName" maxlength="100" required autocomplete="off" placeholder="Ex.: Reforma elétrica — Bloco A"></label>
 <div class="footer-actions"><button class="btn" type="button" data-close="createDialog">Cancelar</button><button class="btn primary" type="submit">Criar lista</button></div></form>
</dialog>
<dialog id="installDialog" aria-labelledby="installTitle"><div class="dialog-inner"><div class="header-modal"><h2 id="installTitle">Instalar TEREON X</h2><button class="btn ghost small" type="button" data-close="installDialog" aria-label="Fechar">✕</button></div><p class="install-help" id="installInstructions">Use a opção de instalação do navegador para colocar o TEREON X na tela inicial.</p><button type="button" class="btn primary full" data-close="installDialog">Entendi</button></div></dialog>
<dialog id="addDialog" aria-labelledby="addTitle">
 <div class="dialog-inner">
  <div class="header-modal"><h2 id="addTitle">Adicionar item</h2><button class="btn ghost small" type="button" data-close="addDialog" aria-label="Fechar">✕</button></div>
  <div><div class="heading">NOME TÉCNICO EM FORMAÇÃO</div><div class="name" id="liveName"></div></div>
  <div class="progress" id="progress" aria-label="Progresso de características obrigatórias"></div>
  <div class="row tiny muted"><span id="counter"></span><span>Ficha de demonstração</span></div>
  <div class="choice-area section"><div class="choice-head"><strong id="fieldLabel"></strong><span id="fieldType" class="tiny muted"></span></div><div class="choices" id="choices"></div><div class="note" id="fieldHelp"></div></div>
  <div class="review section">
    <div class="tag-tray" id="tags" aria-label="Características confirmadas"></div>
    <div class="tag-fields-divider" aria-hidden="true"></div>
    <div class="fields">
     <label>Qtd.<input id="qty" type="number" inputmode="decimal" min="0.001" step="any" value="100"></label>
     <label>Unidade<select id="unit"><option value="m">m</option><option value="un">un</option><option value="rl">rl</option></select></label>
     <label>Etapa<input id="stage" maxlength="100" autocomplete="off" placeholder="Ex.: QD1" value="Geral"></label>
    </div>
    <div class="stage-tags" id="stageTags"></div>
    <button class="btn primary full" id="saveItem" disabled>＋ Adicionar à lista</button>
  </div>
 </div>
</dialog>
<script src="/x/motor-compartilhar.js?v=1"></script>
<script>
(function(){
'use strict';
var STORAGE='tereon-x-lab-v1';
var data={lists:[]},page='home',activeId=null,values={},focus=0,editId=null;
var fields=[
 {id:'material',label:'Material do condutor',required:true,options:['Cobre','Alumínio']},
 {id:'formacao',label:'Formação',required:true,options:['Unipolar','Multipolar']},
 {id:'secao',label:'Seção nominal',required:true,options:['1,5 mm²','2,5 mm²','4,0 mm²','6,0 mm²','10,0 mm²']},
 {id:'isolacao',label:'Isolação',required:true,options:['PVC','HEPR','XLPE']},
 {id:'tensao',label:'Tensão nominal',required:true,options:['450/750 V','0,6/1 kV']},
 {id:'cor',label:'Cor',required:true,options:['Preto','Azul','Vermelho','Branco']},
 {id:'classe',label:'Encordoamento',required:false,options:['Classe 2','Classe 5','Classe 6']}
];
var $=function(id){return document.getElementById(id);};
var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(k){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[k];});};
function load(){try{var s=JSON.parse(localStorage.getItem(STORAGE));if(s&&Array.isArray(s.lists))data=s;}catch(e){console.warn('TEREON X: storage unavailable',e);}}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(e){alert('Não foi possível salvar neste navegador. Verifique o espaço disponível.');}}
function list(){return data.lists.find(function(x){return x.id===activeId;});}
function navigate(target){page=target;draw();}
function draw(){
 var html='';
 if(page==='home'){
  html='<h1>Listas de materiais</h1><p class="muted">Comece uma lista ou continue de onde parou.</p><div class="grid2">'+
   '<button class="tile" data-action="lists"><span class="symbol">☷</span><div><strong>Minhas listas</strong><br><span>'+data.lists.length+' lista(s)</span></div></button>'+
   '<button class="tile" data-action="create"><span class="symbol">＋</span><div><strong>Criar lista</strong><br><span>Nova lista de materiais</span></div></button></div>'+ 
   '<a class="listrow" href="/x/fichario-x/simulador.html" style="margin-top:10px;text-decoration:none;color:inherit;align-items:center"><span><strong>Laboratório de fichas · 24</strong><br><small class="muted">Simular o Fichário Oficial sem alterar suas listas</small></span><span>›</span></a>'+
   '<a class="listrow" href="/x/contribuir.html" style="margin-top:18px;text-decoration:none;color:inherit;align-items:center"><span><strong>Envie seu item para nós</strong><br><small class="muted">Sugira materiais para avaliação do Catálogo Oficial · estudo</small></span><span>›</span></a>';
 }else if(page==='lists'){
  html='<div class="row"><h1>Minhas listas</h1><button class="btn small" data-action="create">＋ Nova</button></div><div class="stack">';
  if(!data.lists.length)html+='<div class="empty">Nenhuma lista criada ainda.</div>';
  data.lists.forEach(function(x){html+='<button class="listrow" data-open="'+esc(x.id)+'"><span><strong>'+esc(x.name)+'</strong><br><small class="muted">'+x.items.length+' lançamento(s)</small></span><span>›</span></button>';});
  html+='</div>';
 }else if(page==='list'){
  var l=list();if(!l){page='lists';draw();return;}
  html='<div class="row"><div class="row"><button class="btn ghost small" data-action="lists" aria-label="Voltar">←</button><div><h1>'+esc(l.name)+'</h1><span class="tiny muted">'+l.items.length+' lançamento(s)</span></div></div></div>'+
   '<div style="margin-top:20px"><button class="btn primary full" data-action="add">＋ Adicionar item</button></div>'+ 
   '<div style="margin-top:10px"><button class="btn full" data-action="share">↗ Compartilhar lista</button></div>'+ 
   '<div style="margin-top:10px;text-align:right"><a href="/x/contribuir.html" style="color:#4f6f59;font-size:12px">Não encontrou o material? Envie seu item para nós ›</a></div>'+
   '<div class="row" style="margin-top:26px"><strong style="font-size:14px">Materiais da lista</strong><span class="tiny muted">'+l.items.length+' item(ns)</span></div><div class="items">';
  if(!l.items.length)html+='<div class="empty">Nenhum material adicionado.</div>';
  l.items.slice().reverse().forEach(function(it){html+='<div class="item"><div><strong>'+esc(it.name)+'</strong><small>'+esc(it.stage)+'</small></div><aside><strong>'+esc(it.qty)+' '+esc(it.unit)+'</strong><div class="item-actions">'+
 '<button class="item-icon" type="button" data-edit="'+esc(it.id)+'" aria-label="Editar item" title="Editar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L9 17l-4 1 1-4z"/></svg></button>'+
 '<button class="item-icon" type="button" data-duplicate="'+esc(it.id)+'" aria-label="Duplicar item" title="Duplicar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg></button>'+
 '<button class="item-icon remove" type="button" data-delete="'+esc(it.id)+'" aria-label="Remover item" title="Remover"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>'+
 '</div></aside></div>';});
  html+='</div>';
 }
 $('screen').innerHTML=html;
}
function name(){
 return 'Condutor elétrico'+(values.formacao?' '+values.formacao.toLowerCase():'')+
 (values.material?' de '+values.material.toLowerCase():'')+(values.secao?' · # '+values.secao:'')+
 (values.isolacao?' · '+values.isolacao:'')+(values.tensao?' · '+values.tensao:'')+
 (values.cor?' · '+values.cor.toLowerCase():'')+(values.classe?' · '+values.classe:'');
}
function count(){return fields.filter(function(x){return x.required&&values[x.id];}).length;}
function pickFirstMissing(){var i=fields.findIndex(function(x){return x.required&&!values[x.id];});return i===-1?fields.length-1:i;}
function redrawAdd(){
 $('liveName').textContent=name();
 $('progress').innerHTML=fields.filter(function(x){return x.required;}).map(function(x){return '<span class="segment'+(values[x.id]?' done':'')+'"></span>';}).join('');
 $('counter').textContent=count()+' / '+fields.filter(function(x){return x.required;}).length+' obrigatórios';
 $('tags').innerHTML=fields.filter(function(x){return values[x.id];}).map(function(x){return '<button class="tag'+(x.required?' required':'')+'" data-remove="'+x.id+'" title="Remover '+esc(x.label)+'">'+esc(values[x.id])+' ×</button>';}).join('')||'<span class="tiny muted">As tags confirmadas aparecem aqui.</span>';
 var f=fields[focus];
 $('fieldLabel').textContent=f.label;
 $('fieldType').textContent=f.required?'Obrigatório':'Opcional';
 $('choices').innerHTML=f.options.map(function(o){return '<button class="tag option'+(values[f.id]===o?' on':'')+'" data-pick="'+esc(o)+'">'+esc(o)+'</button>';}).join('');
 $('fieldHelp').textContent=count()===6?'Obrigatórios preenchidos. O último card é opcional.':'Escolha uma opção; a próxima característica aparecerá automaticamente.';
 var l=list();$('stageTags').innerHTML=(l?.stages||[]).map(function(s){return '<button class="tag" data-stage="'+esc(s)+'">'+esc(s)+'</button>';}).join('');
 validate();
}
function validate(){
 $('saveItem').disabled=!(count()===6&&Number($('qty').value)>0&&$('stage').value.trim());
}
function openAdd(item){
 if(!list())return;
 editId=item?String(item.id):null;
 values=item&&item.values?Object.assign({},item.values):{};
 focus=pickFirstMissing();
 $('qty').value=item?String(item.qty):'100';
 $('unit').value=item?String(item.unit):'m';
 $('stage').value=item?String(item.stage):'Geral';
 $('addTitle').textContent=item?'Editar item':'Adicionar item';
 $('saveItem').textContent=item?'✓ Salvar alterações':'＋ Adicionar à lista';
 redrawAdd();$('addDialog').showModal();
}
function newId(){return String(Date.now())+'-'+Math.random().toString(36).slice(2,8);}
function close(id){$(id).close();}
$('homeButton').addEventListener('click',function(){navigate('home');});
$('screen').addEventListener('click',function(e){
 var a=e.target.closest('[data-action]');if(a){
  if(a.dataset.action==='create'){$('newName').value='';$('createDialog').showModal();$('newName').focus();}
  if(a.dataset.action==='lists')navigate('lists');
  if(a.dataset.action==='share'&&list())window.TereonXShare?.open(list());
  if(a.dataset.action==='add')openAdd();
 }
 var open=e.target.closest('[data-open]');if(open){activeId=open.dataset.open;navigate('list');}
 var edit=e.target.closest('[data-edit]');if(edit&&list()){
  var existing=list().items.find(function(x){return String(x.id)===edit.dataset.edit;});
  if(existing)openAdd(existing);
 }
 var duplicate=e.target.closest('[data-duplicate]');if(duplicate&&list()){
  var source=list().items.find(function(x){return String(x.id)===duplicate.dataset.duplicate;});
  if(source){
   var copy=Object.assign({},source,{id:newId(),values:Object.assign({},source.values||{})});
   list().items.push(copy);persist();draw();
  }
 }
 var del=e.target.closest('[data-delete]');if(del&&list()&&confirm('Remover este lançamento da lista?')){
  var l=list();l.items=l.items.filter(function(x){return String(x.id)!==del.dataset.delete;});persist();draw();
 }
});
document.querySelectorAll('[data-close]').forEach(function(el){el.addEventListener('click',function(){close(el.dataset.close);});});
$('createForm').addEventListener('submit',function(e){
 e.preventDefault();var name=$('newName').value.trim();if(!name)return;
 var id=String(Date.now())+'-'+Math.random().toString(36).slice(2,8);
 data.lists.push({id:id,name:name,items:[],stages:[]});persist();activeId=id;close('createDialog');navigate('list');
});
$('tags').addEventListener('click',function(e){
 var b=e.target.closest('[data-remove]');if(!b)return;
 delete values[b.dataset.remove];
 // Sempre retoma a primeira característica obrigatória ainda pendente,
 // mesmo quando várias tags são removidas em sequência.
 focus=pickFirstMissing();redrawAdd();
});
$('choices').addEventListener('click',function(e){
 var b=e.target.closest('[data-pick]');if(!b)return;
 values[fields[focus].id]=b.dataset.pick;focus=pickFirstMissing();redrawAdd();
});
$('stageTags').addEventListener('click',function(e){var b=e.target.closest('[data-stage]');if(b){$('stage').value=b.dataset.stage;validate();}});
['qty','stage'].forEach(function(x){$(x).addEventListener('input',validate);});
$('saveItem').addEventListener('click',function(){
 var l=list();if(!l||count()!==6||!(Number($('qty').value)>0)||!$('stage').value.trim())return;
 var stage=$('stage').value.trim();var old=l.stages.find(function(x){return x.toLocaleLowerCase('pt-BR')===stage.toLocaleLowerCase('pt-BR');});
 if(!old)l.stages.push(stage);
 var itemData={name:name(),values:Object.assign({},values),qty:$('qty').value,unit:$('unit').value,stage:old||stage};
 if(editId){
  var original=l.items.find(function(x){return String(x.id)===editId;});
  if(!original)return;
  Object.assign(original,itemData);
 }else{
  l.items.push(Object.assign({id:newId()},itemData));
 }
 persist();close('addDialog');editId=null;draw();
});
$('addDialog').addEventListener('cancel',function(){values={};});
load();draw();
})();
</script>
<script>
(function(){
 'use strict';
 const VERSION='x.0.3.4';
 let installPrompt=null;
 let refreshPending=false;
 const button=document.getElementById('installButton');
 const instructionDialog=document.getElementById('installDialog');
 const instructions=document.getElementById('installInstructions');
 const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 const hasActiveDialog=()=>Array.from(document.querySelectorAll('dialog')).some(d=>d.open);
 function maybeRefresh(){
  if(!refreshPending)return;
  if(hasActiveDialog())return;
  refreshPending=false;
  location.reload();
 }
 async function checkUpdates(){
  if(!navigator.onLine)return;
  try{
   const response=await fetch('/x/version.json?_='+Date.now(),{cache:'no-store'});
   if(!response.ok)return;
   const v=await response.json();
   if(typeof v.version==='string'&&v.version!==VERSION){
    refreshPending=true;
    maybeRefresh();
   }
  }catch(e){/* Sem rede: mantém o último protótipo funcional. */}
 }
 async function register(){
  if(!('serviceWorker' in navigator)||!window.isSecureContext)return;
  try{
   const registration=await navigator.serviceWorker.register('/x/sw.js',{scope:'/x/',updateViaCache:'none'});
   await registration.update();
  }catch(e){console.warn('TEREON X: instalação offline não disponível',e);}
 }
 window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();installPrompt=event;
  button.hidden=standalone();
 });
 window.addEventListener('appinstalled',()=>{installPrompt=null;button.hidden=true;});
 button.hidden=standalone();
 button.addEventListener('click',async()=>{
  if(standalone())return;
  if(installPrompt){
   const event=installPrompt;installPrompt=null;
   await event.prompt();
   try{await event.userChoice;}catch(e){}
  }else{
   const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
   instructions.textContent=ios?
    'No Safari, toque em Compartilhar e escolha “Adicionar à Tela de Início”. Abra depois pelo novo ícone.':
    'No Chrome ou Edge, abra o menu ⋮ e escolha “Instalar app” ou “Adicionar à tela inicial”. Se a opção não estiver disponível, atualize a página e verifique se o site está em HTTPS.';
   instructionDialog.showModal();
  }
 });
 document.querySelectorAll('dialog').forEach(d=>d.addEventListener('close',maybeRefresh));
 window.addEventListener('pageshow',()=>{register();checkUpdates();});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkUpdates();maybeRefresh();}});
 window.addEventListener('online',checkUpdates);
})();
</script>
</body>
