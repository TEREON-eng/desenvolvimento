<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEREON X · Fichário de Fichas Técnicas</title><style>
:root{font:14px system-ui,Arial,sans-serif;background:#f6f8f6;color:#17271e}*{box-sizing:border-box}body{margin:0}main{max-width:720px;margin:auto;padding:20px 16px 45px}a{color:#214a34}header{display:flex;align-items:center;gap:14px;margin-bottom:26px}h1{font-size:25px;margin:0 0 4px}h2{font-size:17px;margin:24px 0 12px}p{color:#687c6d;font-size:13px;line-height:1.5}.panel{background:white;border:1px solid #dde5df;border-radius:14px;padding:14px;margin:13px 0}input{width:100%;padding:12px;border:1px solid #cad9cd;border-radius:10px;font:inherit}.card{width:100%;background:white;border:1px solid #dee7df;border-radius:12px;padding:13px 14px;margin:7px 0;text-align:left;display:flex;justify-content:space-between;gap:8px;cursor:pointer}.card strong{display:block}.card small{display:block;color:#748679;margin-top:5px;font-size:11px}.badge{font-size:10px;background:#eff2ee;border-radius:12px;padding:5px 8px;white-space:nowrap;height:max-content}dialog{border:0;border-radius:18px;max-height:88dvh;width:min(96vw,570px);padding:17px;box-shadow:0 20px 65px #0004}dialog::backdrop{background:#14251a8a}.line{border-top:1px solid #e5ebe6;padding:12px 0}.muted{color:#77887a;font-size:12px}.options{font-size:12px;color:#304d39;margin:6px 0}.close{float:right;border:0;background:#ecf1ec;padding:7px 10px;border-radius:9px;cursor:pointer}.alert{background:#fcf5e4;border-radius:10px;padding:10px;font-size:12px;margin:12px 0}[hidden]{display:none}
</style></head><body><main><header><a href="/x/biblioteca/">← Biblioteca</a><strong>TEREON X</strong></header><h1>Fichário de Fichas Técnicas</h1><p>Livro técnico da Biblioteca TEREON. Fichas vinculadas aos materiais do catálogo. Estão disponíveis para consulta e simulação, mesmo com pendências. A inclusão aqui não significa homologação.</p><div class="panel"><input id="search" type="search" placeholder="Pesquisar ficha, família ou código"></div><div id="summary" class="muted"></div><div id="rows"></div><dialog id="dialog"><button id="close" class="close" type="button" aria-label="Fechar">✕</button><h2 id="title"></h2><div id="ref" class="muted"></div><div class="alert" id="warning"></div><div id="fields"></div></dialog></main>
<script src="/x/catalogo/motor.js?v=4"></script><script>
(function(){'use strict';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let records=[];
function paint(){const q=$('search').value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();const fs=records.filter(f=>(f.name+' '+f.id).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().includes(q));$('summary').textContent=records.length+' fichas relacionadas · '+records.filter(f=>f.homologada).length+' homologadas';$('rows').innerHTML=fs.map(f=>'<button class="card" data-id="'+esc(f.id)+'"><span><strong>'+esc(f.name)+'</strong><small>'+esc(f.id)+' · '+f.details.length+' características</small></span><span class="badge">'+(f.kind==='simulacao'?'Simulação':f.homologada?'Aprovada':'Em revisão')+'</span></button>').join('')||'<p>Nenhuma ficha encontrada.</p>'}
$('rows').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const f=records.find(x=>x.id===b.dataset.id);if(!f)return;$('title').textContent=f.name;$('ref').textContent=f.id;$('warning').textContent=f.homologada?'Ficha homologada':f.kind==='simulacao'?'Ficha ainda não criada. Opções fictícias para teste, não aprovadas.':'Ficha em revisão. Disponível para simulação, com pendências técnicas.';$('fields').innerHTML=f.details.map(d=>'<div class="line"><strong>'+esc(d.name)+'</strong> <span class="muted">'+(d.required?'Obrigatório':'Não definido como obrigatório')+'</span><div class="options">'+esc(d.options.join(' · '))+'</div>'+(d.condition?'<small class="muted">Exibição: '+esc(d.condition)+'</small>':'<small class="muted">Condição pendente de revisão</small>')+'</div>').join('')||'<p>Sem detalhes cadastrados.</p>';$('dialog').showModal()});
$('close').onclick=()=>$('dialog').close();$('search').oninput=paint;TereonXCatalog.load().then(x=>{records=x;paint()}).catch(e=>{$('rows').textContent='Erro ao carregar: '+e.message});
})();
</script></body></html>
