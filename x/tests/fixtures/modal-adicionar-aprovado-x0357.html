<dialog id="addDialog" aria-labelledby="addTitle">
 <div class="dialog-inner">
  <div class="header-modal"><h2 id="addTitle">Adicionar item</h2><button class="btn ghost small" type="button" data-close="addDialog" aria-label="Fechar">✕</button></div>
  <div><div class="heading">NOME TÉCNICO EM FORMAÇÃO</div><div class="name" id="liveName"></div></div>
  <div class="detail-navigation" id="detailNavigation" aria-label="Navegação pelos detalhes da ficha"><button type="button" class="detail-arrow" id="detailPrev" aria-label="Detalhe anterior" title="Detalhe anterior">‹</button><div class="progress" id="progress" role="group" aria-label="Navegar por todos os detalhes, obrigatórios e opcionais"></div><button type="button" class="detail-arrow" id="detailNext" aria-label="Próximo detalhe" title="Próximo detalhe">›</button></div>
  <div class="row tiny muted"><span id="counter"></span><span>Ficha de demonstração</span></div>
  <div class="choice-area section"><div class="choice-head"><strong id="fieldLabel"></strong><span id="fieldType" class="tiny muted"></span></div><div class="choices" id="choices"></div><div class="note" id="fieldHelp"></div></div>
  <div class="review section">
    <div class="tag-tray" id="tags" aria-label="Características confirmadas"></div>
    <div class="tag-fields-divider" aria-hidden="true"></div>
    <div class="fields">
     <label>Qtd.<input id="qty" type="number" inputmode="decimal" min="0.001" step="any" value="100"></label>
     <label>Unidade<select id="unit"><option value="m">m</option><option value="un">un</option><option value="rl">rl</option></select></label>
     <label>Etapa<input id="stage" maxlength="100" autocomplete="off" placeholder="Ex.: QD1" value="Geral"></label>
    </div>
    <div class="stage-tags" id="stageTags"></div>
    <button class="btn primary full" id="saveItem" disabled>＋ Adicionar à lista</button>
  </div>
 </div>
</dialog>
